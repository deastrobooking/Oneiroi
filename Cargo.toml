[workspace]
resolver = "3"
members = [
    "crates/virtual-core",
    "crates/virtual-graph",
    "crates/virtual-hap",
    "crates/virtual-hap-sys",
    "crates/virtual-media",
    "crates/virtual-render",
    "crates/virtual-io",
    "crates/virtual-session",
    "crates/virtual-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
virtual-core = { path = "crates/virtual-core" }
virtual-graph = { path = "crates/virtual-graph" }
virtual-hap = { path = "crates/virtual-hap" }
virtual-hap-sys = { path = "crates/virtual-hap-sys" }
virtual-media = { path = "crates/virtual-media" }
virtual-render = { path = "crates/virtual-render" }
virtual-io = { path = "crates/virtual-io" }
virtual-session = { path = "crates/virtual-session" }

# wgpu is pinned to 29 because egui-wgpu 0.35 depends on wgpu 29.0.
# Bumping wgpu ahead of egui-wgpu puts two incompatible wgpu versions in the
# tree and the Device/Queue types stop unifying. Bump them together.
wgpu = "29.0"
winit = "0.30.13"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.16"
env_logger = "0.11"
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["device", "format", "software-scaling"] }
log = "0.4"
midir = "0.10"
naga = { version = "29.0", features = ["wgsl-in"] }
pollster = "0.4"
rustfft = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
snap = "1"
thiserror = "2"

# Media decode and GPU upload are miserable in an unoptimized build; a debug
# session that can't hold framerate can't tell you anything about pacing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
